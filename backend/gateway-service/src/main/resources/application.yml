server:
  port: 8080

spring:
  application:
    name: gateway-service
  cloud:
    gateway:
      routes:
        # Auth Service
        - id: auth-service
          uri: lb://auth-service
          predicates:
            - Path=/api/v1/auth/**
          filters:
            - name: CircuitBreaker
              args:
                name: authCircuitBreaker
                fallbackUri: forward:/fallback/auth
        
        # Delivery Service
        - id: delivery-service
          uri: lb://delivery-service
          predicates:
            - Path=/api/v1/orders/**, /api/v1/menu/**
          filters:
            - AuthenticationFilter
            - name: RateLimiter
              args:
                redis-rate-limiter.replenishRate: 10
                redis-rate-limiter.burstCapacity: 20
        
        # Dine-In Service
        - id: dinein-service
          uri: lb://dinein-service
          predicates:
            - Path=/api/v1/reservations/**, /api/v1/tables/**
          filters:
            - AuthenticationFilter
        
        # Admin Service
        - id: admin-service
          uri: lb://admin-service
          predicates:
            - Path=/api/v1/admin/**, /api/v1/restaurants/**
          filters:
            - AuthenticationFilter
            - RoleAuthorizationFilter=ADMIN
        
        # Events Service
        - id: events-service
          uri: lb://events-service
          predicates:
            - Path=/api/v1/events/**, /api/v1/bookings/**
          filters:
            - AuthenticationFilter
      
      default-filters:
        - name: Retry
          args:
            retries: 3
            statuses: BAD_GATEWAY,SERVICE_UNAVAILABLE
            methods: GET,POST
            backoff:
              firstBackoff: 50ms
              maxBackoff: 500ms
              factor: 2
              basedOnPreviousValue: true

  redis:
    host: ${REDIS_HOST:localhost}
    port: ${REDIS_PORT:6379}

eureka:
  client:
    serviceUrl:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka/}
    fetch-registry: true
    register-with-eureka: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  metrics:
    export:
      prometheus:
        enabled: true

jwt:
  secret: ${JWT_SECRET}
  expiration: 86400000 # 24 hours

logging:
  level:
    org.springframework.cloud.gateway: DEBUG
